name: smolvla-moh
# Python 3.10 — officially recommended by LeRobot/smolVLA docs
# ManiSkill3 requires Python >= 3.9, so 3.10 works for both
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - git
  - git-lfs
  - ffmpeg

  - pip:
    # ManiSkill3
    # NOTE for Mac users: after this installs, you must ALSO install the
    # nightly SAPIEN wheel manually. Run the following (replace cpXY with
    # your Python version, e.g. cp310 for Python 3.10):
    #
    #   PY_VERSION=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
    #   pip install https://github.com/haosulab/SAPIEN/releases/download/nightly/sapien-3.0.0.dev20250303+291f6a77-$PY_VERSION-$PY_VERSION-macosx_12_0_universal2.whl
    #
    # See: https://maniskill.readthedocs.io/en/latest/user_guide/getting_started/macos_install.html
    - mani_skill

    # LeRobot + SmolVLA
    # After creating env, run: cd /opt/lerobot && pip install -e ".[smolvla]"
    # See README for full setup instructions

    # Training utilities
    - wandb
    - omegaconf
    - hydra-core
    - einops
    - accelerate
    - tensorboard

    # HuggingFace ecosystem
    - huggingface_hub
    - transformers
    - datasets

    # Dev tools
    - ipykernel
    - jupyter
    - matplotlib
    - seaborn
    - pandas
