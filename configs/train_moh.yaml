# configs/train_moh.yaml
# Fine-tuning config for SmolVLA + Mixture of Horizons on StackPyramid-v1

experiment:
  name: smolvla_moh_stackpyramid
  seed: 42

policy:
  path: lerobot/smolvla_base
  device: cuda

moh:
    enabled: true
    horizons: [5, 15, 50]
    weighting: learned

dataset:
  repo_id: ceshank01/stack-pyramid-v1-v2
  split: train

training:
  batch_size: 16
  steps: 10000
  save_freq: 2000
  log_freq: 100
  output_dir: results/checkpoints/smolvla_moh

wandb:
  enable: true
  project: smolvla-moh-stackpyramid
  name: smolvla_moh_run1
